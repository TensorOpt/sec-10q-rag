[project]
name = "sec-10q-rag"
version = "0.1.0"
description = "Question answering over SEC 10-Q filings with retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "httpx2",
]

[project.scripts]
sec-rag = "sec_rag.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
